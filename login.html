<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Single+Ink:wght@100..900&family=Montserrat:wght@100..900&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="main_box">
        <h1>Signup</h1>
        <div class="input_box">
            <form onsubmit="return validateForm()">   
                <input type="text" placeholder="Enter your email" id="email" >
                <input type="number" id="phoneNumber" placeholder="Enter your number">
                 <button>Submit</button>
            </form>
            
                
        </div>
    
    </div>
    <script src="app.js"></script>
</body>
</html>
